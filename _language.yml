# Sobrescribe etiquetas por defecto de Quarto en español.
# Sólo cambiamos las que queremos personalizar; el resto sigue
# tomando el default localizado de Quarto (Nota, Advertencia,
# Importante, Precaución).
callout-tip-title: "Recomendación"

# `crossref-apx-prefix` gobierna las REFERENCIAS CRUZADAS a apéndices. Se fija
# aquí por claridad, aunque la traducción al español de Quarto ya lo define.
#
# OJO: no es la clave del encabezado del apéndice. En el .docx ese encabezado
# sale «Appendix A — …» en inglés aunque esta clave esté puesta: en Quarto
# 1.9.38 esa cadena no es localizable. Se corrige después de renderizar con
# `scripts/fix_docx_appendix_label.py`, que el script de empaquetado ejecuta
# automáticamente.
crossref-apx-prefix: "Apéndice"
section-title-appendices: "Apéndices"

