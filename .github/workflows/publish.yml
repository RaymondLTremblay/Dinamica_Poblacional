name: Deploy Quarto Book to GitHub Pages

on:
  push:
    branches: [gh_pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Force every JavaScript action in this workflow onto Node 24.
# This silences the Node 20 deprecation warnings (GitHub is migrating runners
# off Node 20 between June and September 2026). Applied at workflow level so
# both the `build` and `deploy` jobs inherit it.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true

      - name: Install Chrome (for chromote/webshot2)
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake gdal-bin pandoc \
            libabsl-dev libcairo2-dev libcurl4-openssl-dev \
            libfontconfig1-dev libfreetype6-dev libfribidi-dev \
            libgdal-dev libgeos-dev libgit2-dev libglpk-dev \
            libharfbuzz-dev libicu-dev libjpeg-dev libnode-dev \
            libpng-dev libproj-dev librsvg2-dev \
            libsqlite3-dev libssl-dev libtiff-dev libudunits2-dev \
            libuv1-dev libwebp-dev libx11-dev libxml2-dev \
            zlib1g-dev

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Paquetes que se usan SOLO con sintaxis `pkg::fn()` (sin
          # `library(pkg)`) y que setup-r-dependencies puede no detectar
          # automáticamente al escanear los .qmd.
          #   ftExtra: colformat_md() en tablas con markdown.
          #   cowplot: plot_grid / draw_label en chunks de funciones de transferencia.
          #   maps:    dependencia lazy de ggplot2::borders() (mapas mundiales).
          #   styler:  por si se corre scripts/style_all.R en CI.
          #
          # NOTA: `magick` (R) requiere la system library `libmagick++-dev`.
          # No la instalamos en CI porque el render de GitHub Pages es HTML
          # only y `magick` sólo se usa como fallback PNG->PDF en
          # `scripts/collect_figures.R` para el deliverable del editor
          # (que se genera localmente, no en CI). Si en el futuro quieres
          # generar PDF en CI, añade `libmagick++-dev` al apt-get install
          # de arriba y `any::magick` aquí.
          extra-packages: |
            any::ftExtra
            any::cowplot
            any::maps
            any::styler
        env:
          PKG_SYSREQS: "false"
          CHROMOTE_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto book (HTML only)
        run: quarto render --to html

      - name: Copy Google verification file to output
        run: cp google2352045df3d1e270.html docs/google2352045df3d1e270.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
