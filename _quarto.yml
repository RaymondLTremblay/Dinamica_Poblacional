project:
  type: book
  output-dir: docs
  pre-render:
    - rm -rf _freeze .quarto/_freeze
    # Re-apply the orange-book Typst pagebreak patch (Typst 0.13+ compatibility).
    # See typst-patches/README.md for the rationale and removal criteria.
    - bash scripts/patch-orange-book.sh
    # Regenerar los apéndices automáticos (índice de temas e índice de
    # figuras/tablas) ANTES de renderizar, para que reflejen el estado
    # actual de los .qmd. Ambos son idempotentes; sin cambios en los
    # capítulos producen el mismo output.
    - python3 scripts/build_topic_index.py
    - python3 scripts/build_index_fig_tab.py
  post-render:
    # Tras renderizar, recolectar todas las figuras (estáticas + las
    # generadas por chunks en docs/*_files/figure-html/) en una
    # estructura por capítulo dentro de figuras_editor/, con prefijo
    # `Fig_X.Y_<archivo>` correspondiente al número de figura del libro.
    - Rscript scripts/collect_figures.R
  resources:
    - google2352045df3d1e270.html
    - theme.scss
    - theme-dark.scss
    - images
    - favicon
    - robots.txt
    - PDF_Dinamica_Poblacional
book:
  title: Introducción a la Dinámica Poblacional de Orquídeas
  description: >
    Libro digital sobre la dinámica poblacional de orquídeas.
    Incluye métodos de recolección de datos, modelos matriciales,
    análisis bayesianos, elasticidad, LTRE y simulaciones.
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  site-url: 'https://raymondltremblay.github.io/Dinamica_Poblacional/'
  repo-url: 'https://github.com/raymondltremblay/Dinamica_Poblacional'
  repo-actions:
    - edit
    - issue
  favicon: favicon/Orchid_purple.png
  chapters:
    - index.qmd
    - 102-Intro.qmd
    - 103-Ciclos_de_Vida.qmd
    - 104-Recopilacion_datos_en_el_campo.qmd
    - 105-Transiciones.qmd
    - 106-calcular_fecundidad.qmd
    - 107-matU_matF_matC.qmd
    - 108-Bayesian_PPM.qmd
    - 109-Crecimiento_poblacional.qmd
    - 110-Propriedades.qmd
    - 111-Elasticidad.qmd
    - 112-Dinamica_de_Transiciones.qmd
    - 113-Funciones_de_Transferencia.qmd
    - 114-LTRE.qmd
    - 115-Metodos_de_simulaciones.qmd
    - 119-COMPADRE_ORCHIDS.qmd
    - 120-Rage_orquideas.qmd
    - 121-Traduccion_protocolo_informacion.qmd
    - 122-Impacto_de_Datos_sin_Sentido.qmd
    - 123-Conclusion.qmd
    - part: Historia
      chapters:
        - 117_Historia_breve.qmd
        - 118-Carl_Olaf_Tamm.qmd
    - part: Apéndices
      chapters:
        - Appendix_A_Species_List.qmd
        - Appendix_B_Hoja_de_datos.qmd
        - Appendix_C_Datos.qmd
        - Apendice_Glosario.qmd
        - Apendice_Indice_Fig_Tab.qmd
        - Apendice_Indice_Temas.qmd
        - Agradecimientos.qmd
filters:
  - auto-functions.lua
  - spanish-quotes.lua

bibliography: book.bib
# Estilo Lankesteriana (APA name-year): citas (Autor et al. Año), bibliografía
# con todos los autores y "&". Antes: peerj.csl. Ver lankesteriana.csl.
csl: lankesteriana.csl
format:
  html:
    theme:
      light:
        - cosmo
        - theme.scss
      dark:
        - cosmo
        - theme-dark.scss
    mainfont: "Libertinus Serif"
    monofont: "JetBrains Mono"
    toc: true
    toc-depth: 3
    code-copy: true
    code-fold: true
    code-tools: true
    code-overflow: wrap
    math: mathjax
  typst:
    output-file: Introduccion-a-la-Dinamica-Poblacional-de-Orquideas.pdf
    toc: true
    toc-depth: 3
    number-sections: true
    # 1.1.1 = up to three levels of numbered sections (chapter.section.subsection).
    # Deeper levels (####) appear unnumbered.
    section-numbering: 1.1.1
    papersize: us-letter
    fontsize: 11pt
    margin:
      x: 1.6cm
      y: 2.2cm
    columns: 1
    # Explicit font paths so Typst finds user-installed fonts on macOS.
    # ~/Library/Fonts/ is the user-fonts directory; /Library/Fonts/ is system fonts.
    font-paths:
      - "~/Library/Fonts"
      - "/Library/Fonts"
    # Libertinus Serif is an open-source serif designed for scholarly typesetting,
    # with full Spanish/Unicode coverage and matching Sans/Mono families. Install
    # from https://github.com/alerque/libertinus/releases (drop the static OTFs
    # into ~/Library/Fonts/). Unlike EB Garamond, it ships as static fonts that
    # Typst supports without warnings.
    mainfont: "Libertinus Serif"
    sansfont: "Libertinus Sans"
    monofont: "JetBrains Mono"
    keep-typ: false
    # Allow HTML widgets (DiagrammeR, leaflet, etc.) to be rendered as static
    # PNG screenshots via webshot2, instead of failing the build.
    prefer-html: true
    # Clean title block: no placeholder colored bands behind title/author text.
    # Quarto's default title-block uses light-blue panels; we suppress them and
    # rely on Typst's clean default cover layout.
    title-block-style: none
  docx:
    # Word copy for the editor. One combined .docx is produced from all chapters,
    # matching the structure of the HTML and Typst PDF builds. Render selectively
    # with:  quarto render --to docx
    output-file: Introduccion-a-la-Dinamica-Poblacional-de-Orquideas.docx
    toc: true
    toc-depth: 3
    number-sections: true
    # Render HTML widgets (DiagrammeR life-cycle diagrams, leaflet, etc.) as
    # static PNG screenshots via webshot2, mirroring the Typst behavior.
    prefer-html: true
    # Plantilla de estilos tipo Lankesteriana (columna única): cuerpo serif
    # justificado, título en mayúsculas centrado, encabezados en negrita,
    # encabezado/pie "Borrador para revisión editorial". Solo controla la
    # APARIENCIA del .docx; el contenido y las citas no cambian.
    reference-doc: reference.docx

execute:
  freeze: false
  warning: false
  message: false
  error: false

knitr:
  opts_chunk:
    tidy: false
    # Prefijo de la SALIDA de R con "#> " para distinguirla visualmente del
    # código que el lector escribe (convención de R4DS/tidyverse). Marca cada
    # línea de resultado como salida, no como entrada.
    comment: "#>"
    # Cada chunk con figura emite PNG (para HTML/Word) *y* PDF (para el
    # editor — vector cuando es ggplot, embebido en figuras_editor/).
    # El primer dispositivo es el que Quarto incrusta en HTML/Word/Typst;
    # el segundo se genera como artefacto adicional en figure-html/.
    # `cairo_pdf` (en lugar del `pdf` base) soporta UTF-8 — necesario
    # para caracteres como λ, ρ, α, ø, acentos en etiquetas de ejes, etc.
    dev: ["png", "cairo_pdf"]
    R.options:
      cli.hyperlink: false
      cli.hyperlink_help: false
      cli.hyperlink_run: false
      cli.hyperlink_vignette: false

lang: es
editor: visual
