project:
  type: book
  output-dir: docs
  pre-render: rm -rf _freeze
  resources:
    - google2352045df3d1e270.html
    - theme.scss
    - theme-dark.scss
    - images
    - favicon
    - robots.txt
    - PDF_Dinamica_Poblacional
book:
  title: Introducción a la Dinámica Poblacional de Orquídeas
  description: >
    Libro digital sobre la dinámica poblacional de orquídeas.
    Incluye métodos de recolección de datos, modelos matriciales,
    análisis bayesianos, elasticidad, LTRE y simulaciones.
  open-graph: true
  site-url: 'https://raymondltremblay.github.io/Dinamica_Poblacional/'
  repo-url: 'https://github.com/raymondltremblay/Dinamica_Poblacional'
  repo-actions:
    - edit
    - issue
  favicon: favicon/Orchid_purple.png
  chapters:
    - index.qmd
    - 102-Intro.qmd
    - 103-Ciclos_de_Vida.qmd
    - 104-Recopilacion_datos_en_el_campo.qmd
    - 105-Transiciones.qmd
    - 106-calcular_fecundidad.qmd
    - 107-matU_matF_matC.qmd
    - 108-Bayesian_PPM.qmd
    - 109-Crecimiento_poblacional.qmd
    - 110-Propriedades.qmd
    - 111-Elasticidad.qmd
    - 112-Dinamica_de_Transiciones.qmd
    - 113-Funciones_de_Transferencia.qmd
    - 114-LTRE.qmd
    - 115-Metodos_de_simulaciones.qmd
    - 119-COMPADRE_ORCHIDS.qmd
    - 120-Rage_orquideas.qmd
    - 121-Traduccion_protocolo_informacion.qmd
    - 122-Impacto_de_Datos_sin_Sentido.qmd
    - 123-Conclusion.qmd
    - part: Historia
      chapters:
        - 117_Historia_breve.qmd
        - 118-Carl_Olaf_Tamm.qmd
    - part: Apéndices
      chapters:
        - Appendix_A_Species_List.qmd
        - Appendix_B_Hoja_de_datos.qmd
        - Appendix_C_Datos.qmd
        - Agradecimientos.qmd
filters:
  - auto-functions.lua

bibliography: book.bib
csl: peerj.csl
format:
  html:
    theme:
      light:
        - cosmo
        - theme.scss
      dark:
        - cosmo
        - theme-dark.scss
    mainfont: "EB Garamond"
    monofont: "JetBrains Mono"
    toc: true
    toc-depth: 3
    code-copy: true
    code-fold: true
    code-tools: true
    code-overflow: wrap
    math: mathjax
  typst:
    output-file: Introduccion-a-la-Dinamica-Poblacional-de-Orquideas.pdf
    toc: true
    toc-depth: 3
    number-sections: true
    # 1.1.1 = up to three levels of numbered sections (chapter.section.subsection).
    # Deeper levels (####) appear unnumbered.
    section-numbering: 1.1.1
    papersize: us-letter
    fontsize: 11pt
    margin:
      x: 1.6cm
      y: 2.2cm
    columns: 1
    # Explicit font paths so Typst finds user-installed fonts on macOS.
    # ~/Library/Fonts/ is the user-fonts directory; /Library/Fonts/ is system fonts.
    font-paths:
      - "~/Library/Fonts"
      - "/Library/Fonts"
    # The Homebrew Cask version of EB Garamond installs as separate optical-size
    # families ("EB Garamond 08", "EB Garamond 12"). We use the 12 variant for
    # body text. If you install the modern single-family version from Google
    # Fonts instead, change this to just "EB Garamond".
    mainfont: "EB Garamond 12"
    monofont: "JetBrains Mono"
    keep-typ: false
    # Allow HTML widgets (DiagrammeR, leaflet, etc.) to be rendered as static
    # PNG screenshots via webshot2, instead of failing the build.
    prefer-html: true
    # Clean title block: no placeholder colored bands behind title/author text.
    # Quarto's default title-block uses light-blue panels; we suppress them and
    # rely on Typst's clean default cover layout.
    title-block-style: none

execute:
  freeze: false
  warning: false
  message: false
  error: false

knitr:
  opts_chunk:
    tidy: false
    R.options:
      cli.hyperlink: false
      cli.hyperlink_help: false
      cli.hyperlink_run: false
      cli.hyperlink_vignette: false

lang: es
editor: visual
